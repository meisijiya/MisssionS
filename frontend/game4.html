<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>快递接接接</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
body { background: #060612; overflow: hidden; }

.sky { position: fixed; inset: 0; background: linear-gradient(to bottom,#050510,#0d0d2a 50%,#151530 100%); }
.stars { position: absolute; inset: 0; }
.star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle 2s ease-in-out infinite; }
@keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:.8} }

.city { position: fixed; bottom: 70px; left: 0; right: 0; height: 100px; background: #0c0c1e;
  clip-path: polygon(0% 100%,0% 55%,4% 40%,8% 55%,12% 25%,18% 55%,22% 35%,27% 55%,31% 15%,36% 55%,40% 30%,44% 55%,48% 10%,53% 55%,57% 35%,62% 55%,66% 20%,71% 55%,75% 38%,80% 55%,84% 22%,88% 55%,92% 40%,96% 55%,100% 45%,100% 100%); }

.ground { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: linear-gradient(to top,#1a2810,#263516); border-top: 3px solid #3a5c28; }

/* HUD */
.hud { position: fixed; top: 0; left: 0; right: 0; z-index: 50; padding: 10px 14px 8px; background: linear-gradient(to bottom,rgba(0,0,0,0.65),transparent); display: flex; align-items: center; justify-content: space-between; }
.hud-back { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: rgba(255,255,255,0.7); padding: 5px 10px; font-size: 11px; text-decoration: none; display: flex; align-items: center; gap: 4px; }
.hud-title { font-size: 13px; font-weight: 800; color: #FFD93D; }
.hud-right { display: flex; align-items: center; gap: 8px; }
.hp-section { display: flex; align-items: center; gap: 5px; }
.hearts { display: flex; gap: 2px; font-size: 16px; }
.heart { transition: all 0.3s; }
.heart.lost { opacity: 0.12; transform: scale(0.8); filter: grayscale(1); }
.hp-track { width: 68px; height: 9px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
.hp-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg,#f85149,#FFD93D); transition: width 0.4s ease-out; }
.hp-fill.danger { background: linear-gradient(90deg,#ff2222,#ff4444); }
.wave-tag { background: rgba(79,195,247,0.12); border: 1px solid rgba(79,195,247,0.25); border-radius: 20px; padding: 4px 10px; font-size: 11px; color: #4fc3f7; }
.score-tag { background: rgba(255,217,61,0.12); border: 1px solid rgba(255,217,61,0.25); border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 800; color: #FFD93D; }

.diff-bar { position: fixed; top: 48px; left: 0; right: 0; height: 3px; z-index: 40; background: rgba(255,255,255,0.04); }
.diff-fill { height: 100%; background: linear-gradient(90deg,#3fb950,#FFD93D,#f85149); transition: width 0.8s ease-out; }

.wave-banner { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 60; background: rgba(0,0,0,0.75); border: 1px solid rgba(255,217,61,0.4); border-radius: 12px; padding: 6px 20px; font-size: 14px; font-weight: 800; color: #FFD93D; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.wave-banner.show { opacity: 1; }

.player { position: absolute; bottom: 73px; width: 56px; height: 68px; z-index: 20; transition: left 0.04s linear; }
.player img { width: 100%; height: 100%; object-fit: contain; animation: bob 0.5s ease-in-out infinite; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
.player.catch img { animation: catchA 0.15s ease-out; }
@keyframes catchA { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
.player.hurt img { animation: hurtA 0.2s ease-out; filter: brightness(1.8) saturate(0.4); }
@keyframes hurtA { 0%,100%{filter:none} 50%{filter:brightness(1.8) saturate(0.4)} }

.pkg { position: absolute; z-index: 15; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
.pkg.caught { animation: pkgCaught 0.3s ease-out forwards; }
@keyframes pkgCaught { 0%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:0.5} 100%{transform:scale(0);opacity:0} }
.pkg.missed { animation: pkgMiss 0.4s ease-out forwards; }
@keyframes pkgMiss { 0%{transform:scale(1);opacity:1} 100%{transform:scale(0.3) translateY(70px) rotate(45deg);opacity:0} }

.score-pop { position: absolute; font-size: 20px; font-weight: 900; pointer-events: none; z-index: 60; animation: scorePop 0.7s ease-out forwards; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
@keyframes scorePop { 0%{transform:translateY(0) scale(0.5);opacity:1} 100%{transform:translateY(-70px) scale(1.2);opacity:0} }

.combo-big { position: fixed; left: 50%; top: 28%; transform: translate(-50%,-50%); font-size: 62px; font-weight: 900; z-index: 300; color: #FFD93D; text-shadow: 0 0 60px rgba(255,217,61,0.9),0 4px 0 #CC8800; animation: comboBig 1.3s ease-out forwards; }
@keyframes comboBig { 0%{transform:translate(-50%,-50%) scale(0.1) rotate(-10deg);opacity:1} 30%{transform:translate(-50%,-50%) scale(1.6) rotate(5deg);opacity:1} 100%{transform:translate(-50%,-50%) scale(1) rotate(0) translateY(-140px);opacity:0} }

.flash-red { position: fixed; inset: 0; z-index: 200; pointer-events: none; background: radial-gradient(ellipse at 50% 100%,rgba(255,60,60,0.22),transparent 65%); animation: flashR 0.35s ease-out forwards; }
@keyframes flashR { 0%{opacity:1} 100%{opacity:0} }
.flash-green { position: fixed; inset: 0; z-index: 200; pointer-events: none; background: radial-gradient(ellipse at 50% 100%,rgba(63,185,80,0.2),transparent 65%); animation: flashG 0.5s ease-out forwards; }
@keyframes flashG { 0%{opacity:1} 100%{opacity:0} }

.achieve { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg,#1a1a2e,#16213e); border: 1.5px solid #FFD93D; border-radius: 16px; padding: 12px 22px; z-index: 400; color: #fff; text-align: center; box-shadow: 0 0 40px rgba(255,217,61,0.2); animation: achIn .35s ease-out, achOut .4s ease-in 2.3s forwards; }
@keyframes achIn { from{transform:translateX(-50%) translateY(-20px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }
@keyframes achOut { from{opacity:1} to{opacity:0;transform:translateX(-50%) translateY(-15px)} }

.bbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: linear-gradient(to top,rgba(0,0,0,0.7) 50%,transparent); padding: 14px 12px 18px; display: flex; justify-content: space-around; }
.bstat { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 8px 14px; text-align: center; min-width: 72px; }
.bstat-num { font-size: 22px; font-weight: 900; color: #58a6ff; }
.bstat-lbl { font-size: 10px; color: rgba(230,237,243,0.3); margin-top: 1px; }

.ctrl { position: fixed; bottom: 95px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 14px; z-index: 60; pointer-events: none; }
.ctrl-btn { width: 66px; height: 66px; border-radius: 50%; background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.5); font-size: 24px; display: flex; align-items: center; justify-content: center; pointer-events: all; cursor: pointer; transition: all 0.1s; }
.ctrl-btn:active { transform: scale(0.88); background: rgba(255,255,255,0.18); }

.overlay { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; backdrop-filter: blur(8px); }
.ov-title { font-size: 30px; font-weight: 900; color: #FFD93D; text-shadow: 0 0 30px rgba(255,217,61,0.4); }
.ov-sub { font-size: 13px; color: rgba(255,255,255,0.4); text-align: center; line-height: 1.7; }
.ov-btn { background: linear-gradient(135deg,#FFD93D,#FF8C00); border: none; border-radius: 14px; padding: 13px 38px; font-size: 16px; font-weight: 800; color: #1a1a2e; cursor: pointer; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
.ov-score { font-size: 56px; font-weight: 900; color: #fff; }
.ov-label { font-size: 12px; color: rgba(255,255,255,0.35); }
.ov-char { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 12px 20px; }
.ov-char img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 3px solid #FFD93D; }
.ov-char-name { font-size: 16px; font-weight: 800; color: #FFD93D; }
.ov-char-desc { font-size: 11px; color: rgba(255,255,255,0.4); line-height: 1.5; }
</style>
</head>
<body>

<div class="sky"><div class="stars" id="stars"></div></div>
<div class="city"></div>
<div class="ground"></div>

<div class="hud">
  <a href="/games" class="hud-back"><i class="fas fa-th"></i> 游戏</a>
  <div class="hud-title">📦 快递接接接</div>
  <div class="hud-right">
    <div class="wave-tag">波 <span id="waveEl">1</span></div>
    <div class="hp-section">
      <div class="hearts" id="hearts">
        <span class="heart" id="h1">❤️</span>
        <span class="heart" id="h2">❤️</span>
        <span class="heart" id="h3">❤️</span>
      </div>
      <div class="hp-track">
        <div class="hp-fill" id="hpFill" style="width:100%"></div>
      </div>
    </div>
    <div class="score-tag"><i class="fas fa-star" style="color:#FFD93D"></i> <span id="scoreEl">0</span></div>
  </div>
</div>

<div class="diff-bar"><div class="diff-fill" id="diffFill" style="width:5%"></div></div>
<div class="wave-banner" id="waveBanner">第 <span id="bannerWave">1</span> 波</div>

<div id="gameArea" style="position:fixed;inset:0;z-index:10">
  <div class="player" id="player"><img src="/assets/bubu-black-pkg.png" alt="布布"></div>
  <div class="ctrl">
    <div class="ctrl-btn" id="btnL"><i class="fas fa-chevron-left"></i></div>
    <div class="ctrl-btn" id="btnR"><i class="fas fa-chevron-right"></i></div>
  </div>
</div>

<div class="bbar">
  <div class="bstat"><div class="bstat-num" id="comboEl">0</div><div class="bstat-lbl">连击</div></div>
  <div class="bstat"><div class="bstat-num" id="caughtEl">0</div><div class="bstat-lbl">已接</div></div>
  <div class="bstat"><div class="bstat-num" id="diffEl">5%</div><div class="bstat-lbl">难度</div></div>
</div>

<div class="overlay" id="startScreen">
  <div class="ov-char">
    <img src="/assets/bubu-black-pkg.png" alt="布布">
    <div>
      <div class="ov-char-name">布布</div>
      <div class="ov-char-desc">每波18秒，漏接扣血<br>每波结束回血，难度递增<br>坚持越久分数越高！</div>
    </div>
  </div>
  <div class="ov-title">📦 快递接接接</div>
  <div class="ov-sub">难度从简到难，慢慢加速<br>血条空了游戏结束</div>
  <button class="ov-btn" onclick="G.start()">开始挑战！</button>
</div>

<div class="overlay" id="resultScreen" style="display:none">
  <div class="ov-title">游戏结束</div>
  <div class="ov-score" id="finalScore">0</div>
  <div class="ov-label">收到快递</div>
  <div style="display:flex;gap:14px">
    <div class="bstat"><div class="bstat-num" style="color:#4fc3f7" id="resWave">1</div><div class="bstat-lbl">到达波数</div></div>
    <div class="bstat"><div class="bstat-num" style="color:#FFD93D" id="resCombo">0</div><div class="bstat-lbl">最高连击</div></div>
  </div>
  <button class="ov-btn" onclick="G.restart()">再来一次</button>
</div>

<div id="achieveBox"></div>

<script>
/*星空*/
(function(){
  var s=document.getElementById('stars');
  for(var i=0;i<55;i++){
    var x=document.createElement('div');x.className='star';
    var sz=parseFloat((1+Math.random()*2).toFixed(1));
    x.style.cssText='left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*55).toFixed(1)+'%;width:'+sz+'px;height:'+sz+'px;animation-delay:'+(Math.random()*3).toFixed(1)+'s';
    s.appendChild(x);
  }
})();

/*音效*/
var _ac=null;
var gad=function(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;};
var sc=function(o,f,g,v1,t1,v2,t2){
  var c=gad(),osc=c.createOscillator(),g2=c.createGain();
  osc.connect(g2);g2.connect(c.destination);
  osc.frequency.setValueAtTime(f,c.currentTime);
  osc.frequency.exponentialRampToValueAtTime(g,c.currentTime+t1);
  g2.gain.setValueAtTime(v1,c.currentTime);
  g2.gain.exponentialRampToValueAtTime(v2,c.currentTime+t2);
  osc.start(c.currentTime);osc.stop(c.currentTime+t2);
};
var sndCatch=function(){sc(0,880,1760,0.18,0.1,0.001,0.12);};
var sndCombo=function(n){
  var fs=n>=8?[523,659,784,1047]:n>=5?[523,659,784]:[523,659];
  fs.forEach(function(f,i){sc(0,f,f,0,i*0.07,0.18,i*0.07+0.2);});
};
var sndMiss=function(){sc(0,350,60,0.22,0.4,0.001,0.4);};
var sndWaveClear=function(){
  [523,659,784,1047].forEach(function(f,i){sc(0,f,f,0.18,i*0.1,0.001,i*0.1+0.25);});
};
var sndHeal=function(){
  [440,660,880].forEach(function(f,i){sc(0,f,f,0.15,i*0.08,0.001,i*0.08+0.3);});
};
var sndOver=function(){
  [392,330,262,196].forEach(function(f,i){sc(0,f,f,0.18,i*0.2,0.001,i*0.2+0.25);});
};

/*游戏*/
var G={
  phase:'start',playerX:50,hp:100,maxHp:100,
  score:0,combo:0,maxCombo:0,totalCaught:0,
  wave:1,diff:5,
  timers:null,spawnT:null,waveT:null,
  leftP:false,rightP:false,
  earned:{}, // 改对象方便查找

  start:function(){
    this.phase='playing';
    this.hp=100;this.score=0;this.combo=0;this.maxCombo=0;
    this.totalCaught=0;this.wave=1;this.diff=5;
    document.getElementById('startScreen').style.display='none';
    document.getElementById('resultScreen').style.display='none';
    this._clearAll();
    this._upHP();this._upUI();
    this._startWave();
    this._startLoop();
  },

  restart:function(){this.start();},

  _clearAll:function(){
    if(this.timers)clearInterval(this.timers);
    if(this.spawnT)clearTimeout(this.spawnT);
    if(this.waveT)clearTimeout(this.waveT);
    var pkgs=document.querySelectorAll('.pkg');
    for(var i=0;i<pkgs.length;i++)pkgs[i].remove();
  },

  _startLoop:function(){
    var self=this;
    this.timers=setInterval(function(){
      if(self.phase!=='playing')return;
      var W=window.innerWidth,PW=56;
      var spd=Math.max(1.5,3.5-self.diff*0.02);
      if(self.leftP) self.playerX=Math.max(1,self.playerX-spd);
      if(self.rightP) self.playerX=Math.min(99,self.playerX+spd);
      var p=document.getElementById('player');
      p.style.left=(self.playerX/100*(W-PW))+'px';
    },16);
  },

  _startWave:function(){
    var self=this;
    document.getElementById('waveEl').textContent=this.wave;
    document.getElementById('diffFill').style.width=this.diff+'%';
    document.getElementById('diffEl').textContent=this.diff+'%';
    this._banner('第 '+this.wave+' 波');

    var dur=Math.max(8000,18000-this.diff*100);
    this.waveT=setTimeout(function(){
      if(self.phase!=='playing')return;
      self._clearPkgs();
      sndWaveClear();
      self._flashG();
      self.hp=Math.min(self.maxHp,self.hp+35);
      self._upHP();
      sndHeal();
      self.wave++;
      self.diff=Math.min(95,self.diff+13);
      setTimeout(function(){self._startWave();},1800);
    },dur);

    this._spawnLoop();
  },

  _spawnLoop:function(){
    var self=this;
    if(this.phase!=='playing')return;
    this._spawnPkg();
    var d=Math.max(300,1300-this.diff*10)+Math.random()*250;
    this.spawnT=setTimeout(function(){self._spawnLoop();},d);
  },

  _spawnPkg:function(){
    var el=document.createElement('div');
    el.className='pkg';
    var rare=Math.random()<0.05;
    var small=Math.random()<this.diff/120;
    var sz=rare?42:(small?22:32);
    el.style.cssText='left:'+(5+Math.random()*86)+'%;top:'+(-(parseFloat(sz)-10))+'px;font-size:'+sz+'px;';
    el.textContent=rare?'🎁':'📦';
    if(rare) el.style.filter='drop-shadow(0 0 10px rgba(255,217,61,0.9))';
    el._x=parseFloat(el.style.left);
    el._done=false;
    document.getElementById('gameArea').appendChild(el);
    this._checkHit(el);
  },

  _checkHit:function(el){
    var self=this;
    var fn=function(){
      if(el._done) return;
      if(self.phase!=='playing'){el.remove();el._done=true;return;}
      var r=el.getBoundingClientRect();
      var pr=document.getElementById('player').getBoundingClientRect();
      if(r.bottom>=pr.top&&r.bottom<=pr.bottom+30&&r.left<pr.right&&r.right>pr.left){
        el._done=true;el.classList.add('caught');
        self._catch(el);setTimeout(function(){el.remove();},300);
        return;
      }
      if(r.top>window.innerHeight){
        el._done=true;el.classList.add('missed');
        self._miss();setTimeout(function(){el.remove();},400);
        return;
      }
      requestAnimationFrame(fn);
    };
    requestAnimationFrame(fn);
  },

  _catch:function(el){
    this.totalCaught++;this.combo++;
    if(this.combo>this.maxCombo)this.maxCombo=this.combo;
    var base=Math.min(3,1+Math.floor(this.combo/4);
    var mult=Math.ceil(this.diff/20);
    var pts=base*mult;
    this.score+=pts;
    this._upUI();sndCatch();
    var p=document.getElementById('player');
    p.classList.remove('catch');void p.offsetWidth;p.classList.add('catch');
    setTimeout(function(){p.classList.remove('catch');},150);
    if(this.combo>=3&&this.combo%3===0){sndCombo(this.combo);this._showCombo(this.combo);}
    this._checkAchieve();
    this._pop(el,pts,this.combo>=3?'#FFD93D':'#58a6ff');
  },

  _miss:function(){
    this.combo=0;
    var dmg=8+Math.floor(this.diff/10);
    this.hp=Math.max(0,this.hp-dmg);
    this._upHP();this._upUI();
    sndMiss();this._flashR();
    var p=document.getElementById('player');
    p.classList.remove('hurt');void p.offsetWidth;p.classList.add('hurt');
    setTimeout(function(){p.classList.remove('hurt');},200);
    if(this.hp<=0)this._over();
  },

  _over:function(){
    this.phase='over';
    this._clearAll();
    sndOver();
    document.getElementById('finalScore').textContent=this.totalCaught;
    document.getElementById('resWave').textContent=this.wave;
    document.getElementById('resCombo').textContent=this.maxCombo;
    document.getElementById('resultScreen').style.display='flex';
    this._checkAchieve();
  },

  _clearPkgs:function(){
    var pkgs=document.querySelectorAll('.pkg');
    for(var i=0;i<pkgs.length;i++){pkgs[i]._done=true;pkgs[i].remove();}
  },

  _upHP:function(){
    var pct=(this.hp/this.maxHp*100).toFixed(0);
    var f=document.getElementById('hpFill');
    f.style.width=pct+'%';
    f.className='hp-fill'+(this.hp<=30?' danger':'');
    for(var i=1;i<=3;i++){
      var h=document.getElementById('h'+i);
      h.className='heart'+(this.hp<=(i-1)*33?' lost':'');
    }
  },

  _upUI:function(){
    document.getElementById('scoreEl').textContent=this.score;
    document.getElementById('comboEl').textContent=this.combo;
    document.getElementById('caughtEl').textContent=this.totalCaught;
  },

  _banner:function(t){
    var b=document.getElementById('waveBanner');
    document.getElementById('bannerWave').textContent=this.wave;
    b.classList.remove('show');
    void b.offsetWidth;b.classList.add('show');
    setTimeout(function(){b.classList.remove('show');},1500);
  },

  _pop:function(el,pts,color){
    var pop=document.createElement('div');
    pop.className='score-pop';
    var r=el.getBoundingClientRect();
    pop.style.left=r.left+'px';pop.style.top=r.top+'px';
    pop.style.color=color;pop.textContent='+'+pts;
    document.body.appendChild(pop);
    setTimeout(function(){pop.remove();},700);
  },

  _showCombo:function(n){
    var el=document.createElement('div');
    el.className='combo-big';el.textContent=n+' COMBO! 🔥';
    document.body.appendChild(el);
    setTimeout(function(){el.remove();},1300);
  },

  _flashR:function(){
    var f=document.createElement('div');f.className='flash-red';
    document.body.appendChild(f);setTimeout(function(){f.remove();},350);
  },
  _flashG:function(){
    var f=document.createElement('div');f.className='flash-green';
    document.body.appendChild(f);setTimeout(function(){f.remove();},500);
  },

  _checkAchieve:function(){
    var self=this;
    var list=[
      ['c5',5,'收到5件!'],['c15',15,'收到15件!'],['c30',30,'收到30件!'],
      ['c50',50,'收到50件!'],['w3',3,'到达波3!'],['w5',5,'到达波5!'],
      ['co5',5,'5连击!'],['co10',10,'10连击!'],['co15',15,'15连击!'],
    ];
    list.forEach(function(item){
      var id=item[0],th=item[1],label=item[2];
      var cond=id[0]==='c'?self.totalCaught>=th:id[0]==='w'?self.wave>=th:self.maxCombo>=th;
      if(!self.earned[id]&&cond){
        self.earned[id]=true;
        var el=document.createElement('div');
        el.className='achieve';
        el.innerHTML='<div style="font-size:15px">🏆 成就解锁</div><div style="font-size:12px;margin-top:3px;color:#FFD93D">'+label+'</div>';
        document.getElementById('achieveBox').appendChild(el);
        setTimeout(function(){el.remove();},2800);
      }
    });
  }
};

/*控制*/
var btnL=document.getElementById('btnL'),btnR=document.getElementById('btnR');
var startL=function(){G.leftP=true;},stopL=function(){G.leftP=false;};
var startR=function(){G.rightP=true;},stopR=function(){G.rightP=false;};
btnL.addEventListener('mousedown',function(e){e.preventDefault();startL();});
btnL.addEventListener('mouseup',stopL);
btnL.addEventListener('mouseleave',stopL);
btnL.addEventListener('touchstart',function(e){e.preventDefault();startL();},{passive:false});
btnL.addEventListener('touchend',function(e){e.preventDefault();stopL();},{passive:false});
btnR.addEventListener('mousedown',function(e){e.preventDefault();startR();});
btnR.addEventListener('mouseup',stopR);
btnR.addEventListener('mouseleave',stopR);
btnR.addEventListener('touchstart',function(e){e.preventDefault();startR();},{passive:false});
btnR.addEventListener('touchend',function(e){e.preventDefault();stopR();},{passive:false});

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a')G.leftP=true;
  if(e.key==='ArrowRight'||e.key==='d')G.rightP=true;
});
document.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft'||e.key==='a')G.leftP=false;
  if(e.key==='ArrowRight'||e.key==='d')G.rightP=false;
});

/*触摸滑动*/
var touchX=null;
document.getElementById('gameArea').addEventListener('touchstart',function(e){touchX=e.touches[0].clientX;},{passive:true});
document.getElementById('gameArea').addEventListener('touchmove',function(e){
  e.preventDefault();
  if(touchX===null)return;
  var dx=e.touches[0].clientX-touchX;
  touchX=e.touches[0].clientX;
  G.playerX=Math.max(1,Math.min(99,G.playerX+dx*0.28));
},{passive:false});
</script>
