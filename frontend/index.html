<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 主题初始化（避免闪烁）
        (function() {
            const t = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root, [data-theme="dark"] {
            --bg: #0d1117;
            --card: #161b22;
            --card-hover: #1c2128;
            --border: #30363d;
            --text: #e6edf3;
            --text-2: #8b949e;
            --text-3: #484f58;
            --blue: #58a6ff;
            --green: #3fb950;
            --amber: #d29922;
            --red: #f85149;
            --purple: #bc8cff;
            --pink: #db6d8b;
            --cyan: #39c5cf;
        }
        [data-theme="light"] {
            --bg: #f0f2f5;
            --card: #ffffff;
            --card-hover: #f7f8fa;
            --border: #d0d7de;
            --text: #1f2328;
            --text-2: #656d76;
            --text-3: #afb8c1;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }
        .accent-bar {
            height: 2px;
            background: linear-gradient(90deg, var(--blue), var(--purple), var(--pink));
        }
        /* --- 新闻轮播 --- */
        .news-wrap {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }
        .news-flag {
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%);
            background: var(--blue);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 0 20px 20px 0;
            z-index: 2;
        }
        .news-track {
            display: flex;
            gap: 48px;
            white-space: nowrap;
            padding: 11px 0 11px 72px;
            animation: ticker 40s linear infinite;
        }
        .news-track:hover { animation-play-state: paused; }
        .news-item {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--text-2);
            font-size: 12px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .news-item:hover { color: var(--blue); }
        .news-src {
            font-size: 9px;
            background: var(--border);
            color: var(--text-3);
            padding: 2px 6px;
            border-radius: 8px;
        }
        @keyframes ticker {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        /* --- 通用卡片 --- */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            transition: all 0.2s;
        }
        .card:hover { background: var(--card-hover); }
        /* --- 任务卡片 --- */
        .task-card {
            border-left: 3px solid transparent;
            cursor: default;
        }
        .task-card:hover { border-color: #3a4a5e !important; }
        .task-card.done { opacity: 0.45; }
        .task-card.done .task-title { text-decoration: line-through; color: var(--text-3); }
        .check-btn {
            width: 20px; height: 20px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .check-btn:hover { border-color: var(--green); }
        .check-btn.checked { background: var(--green); border-color: var(--green); color: #fff; }
        /* --- 颜色选择 --- */
        .color-dot {
            width: 22px; height: 22px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.15s;
            border: 2px solid transparent;
        }
        .color-dot:hover { transform: scale(1.15); }
        .color-dot.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px currentColor; }
        /* --- 统计 --- */
        .stat-num { font-size: 26px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
        /* --- 按钮 --- */
        .btn-blue {
            background: var(--blue); color: #fff;
            border: none; border-radius: 8px;
            padding: 9px 18px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-blue:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-ghost {
            background: transparent; color: var(--text-3);
            border: none; border-radius: 6px;
            padding: 5px 10px; font-size: 12px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-ghost:hover { color: var(--red); background: rgba(248,81,73,0.1); }
        /* --- 输入框 --- */
        .input {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 9px 14px;
            font-size: 13px;
            width: 100%;
            transition: border-color 0.2s;
        }
        .input:focus { outline: none; border-color: var(--blue); }
        .input::placeholder { color: var(--text-3); }
        /* --- 全量新闻页 --- */
        .news-full-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: block;
            color: inherit;
        }
        .news-full-card:hover {
            background: var(--card-hover);
            border-color: var(--blue);
            transform: translateX(3px);
        }
        .news-full-card .news-title { font-size: 14px; font-weight: 500; margin-bottom: 6px; line-height: 1.4; }
        .news-full-card .news-summary { font-size: 12px; color: var(--text-2); line-height: 1.6; margin-bottom: 8px; }
        .news-full-card .news-meta { display: flex; gap: 12px; align-items: center; }
        .news-meta .src-tag {
            font-size: 10px; font-weight: 600;
            padding: 2px 8px; border-radius: 10px;
        }
        /* --- 视图切换 --- */
        .nav-btn {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-2);
        }
        .nav-btn.active {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
        }
        .nav-btn:hover:not(.active) { border-color: var(--blue); color: var(--blue); }
        /* --- 时间戳 --- */
        .ts { font-size: 11px; color: var(--text-3); font-family: 'SF Mono', monospace; }
        /* --- 滚动条 --- */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>

<div class="accent-bar"></div>

<!-- 新闻轮播 -->
<div class="news-wrap" id="news-banner" onclick="showFullNews()">
    <div class="news-flag"><i class="fas fa-rss fa-xs mr-1"></i>NEWS</div>
    <div class="news-track" id="news-track">
        <span class="news-item"><span class="news-src">系统</span>正在加载新闻...</span>
    </div>
</div>

<!-- 主内容 -->
<div class="max-w-3xl mx-auto px-4 py-6">

    <!-- 顶部：标题 + 视图切换 + 主题 -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-xl font-bold">
                <i class="fas fa-layer-group mr-2" style="color:var(--blue)"></i>任务中心
            </h1>
            <p class="ts mt-1" id="clock"></p>
        </div>
        <div class="flex items-center gap-3">
            <!-- 主题切换 -->
            <button id="theme-btn" onclick="toggleTheme()" title="切换主题" style="background:none;border:none;cursor:pointer;color:var(--text-2);font-size:16px;padding:4px;">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
            <div class="flex gap-2">
                <button class="nav-btn active" id="tab-task" onclick="switchView('task')">
                    <i class="fas fa-check-square mr-1"></i>任务
                </button>
                <button class="nav-btn" id="tab-news" onclick="switchView('news')">
                    <i class="fas fa-newspaper mr-1"></i>新闻 <span class="text-xs opacity-70" id="news-count-badge"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- ========== 任务视图 ========== -->
    <div id="view-task">
        <!-- 添加任务 -->
        <div class="card mb-5">
            <div class="flex gap-3 mb-4">
                <input type="text" id="task-input" class="input flex-1"
                    placeholder="输入新任务，按 Enter 添加..."
                    onkeypress="if(event.key==='Enter') addTask()">
                <button class="btn-blue" onclick="addTask()">
                    <i class="fas fa-plus mr-2"></i>添加
                </button>
            </div>
            <div class="flex items-center gap-3">
                <span class="ts">颜色</span>
                <div class="flex gap-2" id="color-row">
                    <div class="color-dot sel" style="background:#58a6ff;" data-c="#58a6ff" onclick="pickColor(this)"></div>
                    <div class="color-dot" style="background:#3fb950;" data-c="#3fb950" onclick="pickColor(this)"></div>
                    <div class="color-dot" style="background:#d29922;" data-c="#d29922" onclick="pickColor(this)"></div>
                    <div class="color-dot" style="background:#f85149;" data-c="#f85149" onclick="pickColor(this)"></div>
                    <div class="color-dot" style="background:#bc8cff;" data-c="#bc8cff" onclick="pickColor(this)"></div>
                    <div class="color-dot" style="background:#db6d8b;" data-c="#db6d8b" onclick="pickColor(this)"></div>
                    <div class="color-dot" style="background:#39c5cf;" data-c="#39c5cf" onclick="pickColor(this)"></div>
                </div>
                <span class="ts" id="color-tip">#58a6ff</span>
            </div>
        </div>

        <!-- 统计 -->
        <div class="grid grid-cols-3 gap-3 mb-5">
            <div class="card text-center">
                <div class="stat-num" style="color:var(--blue)" id="s-total">0</div>
                <div class="ts">全部</div>
            </div>
            <div class="card text-center">
                <div class="stat-num" style="color:var(--green)" id="s-done">0</div>
                <div class="ts">已完成</div>
            </div>
            <div class="card text-center">
                <div class="stat-num" style="color:var(--amber)" id="s-pending">0</div>
                <div class="ts">待完成</div>
            </div>
        </div>

        <!-- 操作栏 -->
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold" style="color:var(--text-2)">
                <i class="fas fa-list-ul mr-2" style="color:var(--purple)"></i>任务列表
            </h2>
            <button class="btn-ghost" id="btn-clear-done" onclick="clearDone()" style="display:none">
                <i class="fas fa-trash-alt mr-1"></i>清空已完成
            </button>
        </div>

        <!-- 任务列表 -->
        <div id="task-list" class="space-y-2"></div>
        <div id="task-empty" class="text-center py-12" style="display:none">
            <div style="font-size:40px;color:var(--text-3);margin-bottom:12px"><i class="fas fa-clipboard-list"></i></div>
            <p style="color:var(--text-3);font-size:14px">暂无任务</p>
        </div>
    </div>

    <!-- ========== 新闻视图 ========== -->
    <div id="view-news" style="display:none">
        <div class="flex items-center justify-between mb-4">
            <div>
                <h2 class="text-base font-semibold" style="color:var(--text)">
                    <i class="fas fa-newspaper mr-2" style="color:var(--blue)"></i>全部新闻
                </h2>
                <p class="ts mt-1">点击卡片可跳转原文 · 每天08:00/12:00/16:00/20:00更新</p>
            </div>
            <button class="btn-ghost" onclick="refreshNews()">
                <i class="fas fa-sync-alt mr-1"></i>刷新
            </button>
        </div>
        <div id="news-full-list" class="space-y-3"></div>
        <div id="news-empty" class="text-center py-12" style="display:none">
            <div style="font-size:40px;color:var(--text-3);margin-bottom:12px"><i class="fas fa-newspaper"></i></div>
            <p style="color:var(--text-3);font-size:14px">暂无新闻</p>
        </div>
    </div>
</div>

<script>
    // ========== 全局状态 ==========
    let selColor = '#58a6ff';
    let tasks = [];
    let tickerNews = [];   // 滚动区：最新一批10条
    let allNews = [];      // 全量页：7天全部

    // ========== 时钟 ==========
    function tick() {
        document.getElementById('clock').textContent = new Date().toLocaleString('zh-CN', {
            weekday:'short', year:'numeric', month:'short', day:'numeric',
            hour:'2-digit', minute:'2-digit', second:'2-digit'
        });
    }
    setInterval(tick, 1000); tick();

    // ========== 视图切换 ==========
    function switchView(v) {
        document.getElementById('view-task').style.display = v === 'task' ? '' : 'none';
        document.getElementById('view-news').style.display = v === 'news' ? '' : 'none';
        document.getElementById('tab-task').classList.toggle('active', v === 'task');
        document.getElementById('tab-news').classList.toggle('active', v === 'news');
        if (v === 'news') loadAllNews();
    }

    // ========== 颜色选择 ==========
    function pickColor(el) {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('sel'));
        el.classList.add('sel');
        selColor = el.dataset.c;
        document.getElementById('color-tip').textContent = selColor;
    }

    // ========== 加载任务 ==========
    async function loadTasks() {
        try {
            tasks = await (await fetch('/api/tasks')).json();
            renderTasks();
        } catch(e) { console.error(e); }
    }

    function renderTasks() {
        const list = document.getElementById('task-list');
        const empty = document.getElementById('task-empty');
        const btnClear = document.getElementById('btn-clear-done');
        const sorted = [...tasks].sort((a,b) => {
            if (a.completed !== b.completed) return a.completed - b.completed;
            return new Date(b.created_at) - new Date(a.created_at);
        });
        if (!sorted.length) {
            list.innerHTML = ''; empty.style.display = ''; btnClear.style.display = 'none';
            return;
        }
        empty.style.display = 'none';
        btnClear.style.display = sorted.some(t=>t.completed) ? '' : 'none';
        list.innerHTML = sorted.map(t => `
            <div class="card task-card ${t.completed?'done':''}" style="border-left-color:${t.completed?'var(--text-3)':t.color}">
                <div class="flex items-center gap-3">
                    <div class="check-btn ${t.completed?'checked':''}" onclick="toggle(${t.id},${!t.completed})">
                        ${t.completed?'<i class="fas fa-check fa-xs"></i>':''}
                    </div>
                    <div class="flex-1 task-title">${esc(t.title)}</div>
                    <button class="btn-ghost" onclick="delTask(${t.id})"><i class="fas fa-trash-alt"></i></button>
                </div>
                <div class="flex items-center gap-4 mt-2">
                    <span class="ts"><i class="far fa-clock mr-1"></i>${fmt(t.created_at)}</span>
                    ${t.completed&&t.completed_at?`<span class="ts" style="color:var(--green)"><i class="fas fa-check-circle mr-1"></i>${fmt(t.completed_at)}</span>`:''}
                    <div class="flex gap-1.5 ml-auto">
                        ${['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#db6d8b','#39c5cf'].map(c=>
                            `<div onclick="chColor(${t.id},'${c}')" style="width:12px;height:12px;border-radius:50%;background:${c};cursor:pointer;opacity:${t.color===c?1:0.35};transition:opacity 0.15s"></div>`
                        ).join('')}
                    </div>
                </div>
            </div>
        `).join('');
        document.getElementById('s-total').textContent = sorted.length;
        document.getElementById('s-done').textContent = sorted.filter(t=>t.completed).length;
        document.getElementById('s-pending').textContent = sorted.filter(t=>!t.completed).length;
    }

    async function addTask() {
        const v = document.getElementById('task-input').value.trim();
        if (!v) return;
        await fetch('/api/tasks', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({title:v, color:selColor})});
        document.getElementById('task-input').value = '';
        loadTasks();
    }
    async function toggle(id, completed) {
        await fetch(`/api/tasks/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({completed})});
        loadTasks();
    }
    async function delTask(id) {
        if (!confirm('删除此任务？')) return;
        await fetch(`/api/tasks/${id}`, {method:'DELETE'});
        loadTasks();
    }
    async function clearDone() {
        if (!confirm('清空已完成任务？')) return;
        await fetch('/api/tasks/clear-completed', {method:'DELETE'});
        loadTasks();
    }
    async function chColor(id, color) {
        await fetch(`/api/tasks/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({color})});
        loadTasks();
    }

    // ========== 主题切换 ==========
    function toggleTheme() {
        const html = document.documentElement;
        const cur = html.getAttribute('data-theme');
        const next = cur === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon(next);
    }
    function updateThemeIcon(t) {
        const icon = document.getElementById('theme-icon');
        icon.className = t === 'light' ? 'fas fa-sun' : 'fas fa-moon';
    }
    // 初始化主题图标
    updateThemeIcon(localStorage.getItem('theme') || 'dark');

    // ========== 加载新闻(轮播) - 只加载最新一批 ==========
    async function loadNews() {
        try {
            tickerNews = await (await fetch('/api/news/latest')).json();
            renderTicker(tickerNews);
            document.getElementById('news-count-badge').textContent = tickerNews.length;
        } catch(e) { setTickerDefault(); }
    }

    // ========== 全量新闻页（单独加载7天全部） ==========
    async function loadAllNews() {
        try {
            allNews = await (await fetch('/api/news')).json();
            document.getElementById('news-count-badge').textContent = allNews.length;
            renderFullNews();
        } catch(e) { console.error(e); }
    }

    function renderTicker(news) {
        const track = document.getElementById('news-track');
        if (!news || !news.length) { setTickerDefault(); return; }
        const dup = [...news, ...news];
        track.innerHTML = dup.map(n =>
            `<a class="news-item" href="${n.link||'#'}" target="_blank">
                <span class="news-src">${esc(n.source)}</span>${esc(n.title)}
             </a>`
        ).join('');
    }

    function setTickerDefault() {
        document.getElementById('news-track').innerHTML =
            '<span class="news-item"><span class="news-src">系统</span>正在加载新闻...</span>';
    }

    // ========== 全量新闻页 ==========
    function renderFullNews() {
        const container = document.getElementById('news-full-list');
        const empty = document.getElementById('news-empty');
        if (!allNews.length) {
            container.innerHTML = ''; empty.style.display = '';
            return;
        }
        empty.style.display = 'none';

        // 按日期分组
        const groups = {};
        allNews.forEach(n => {
            const d = new Date(n.fetched_at);
            const key = d.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
            if (!groups[key]) groups[key] = [];
            groups[key].push(n);
        });

        const srcColors = {'36氪':'#3fb950','人民日报':'#f85149','新浪新闻':'#d29922','参考消息':'#58a6ff','系统':'#8b949e'};

        let html = '';
        Object.entries(groups).forEach(([date, items]) => {
            html += `
            <div class="mb-6">
                <div class="flex items-center gap-3 mb-3">
                    <div style="width:8px;height:8px;border-radius:50%;background:var(--blue)"></div>
                    <span class="text-sm font-semibold" style="color:var(--text-2)">${date}</span>
                    <div style="flex:1;height:1px;background:var(--border)"></div>
                    <span class="ts">${items.length} 条</span>
                </div>
                <div class="space-y-2">
            `;
            items.forEach(n => {
                const col = srcColors[n.source] || 'var(--blue)';
                html += `
                <a href="${n.link||'#'}" target="_blank" class="news-full-card">
                    <div class="flex items-start gap-3">
                        <div style="width:4px;min-height:100%;background:${col};border-radius:2px;align-self:stretch;flex-shrink:0"></div>
                        <div class="flex-1 min-w-0">
                            <div class="news-title">${esc(n.title)}</div>
                            ${n.summary ? `<div class="news-summary">${esc(n.summary)}</div>` : ''}
                            <div class="news-meta">
                                <span class="src-tag" style="background:${col}22;color:${col}">${esc(n.source)}</span>
                                <span class="ts"><i class="far fa-clock mr-1"></i>${fmtFull(n.fetched_at)}</span>
                                <span style="font-size:11px;color:var(--blue);margin-left:auto">
                                    阅读原文 <i class="fas fa-external-link-alt fa-xs"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                </a>`;
            });
            html += '</div></div>';
        });

        container.innerHTML = html;
    }

    async function refreshNews() {
        try {
            await fetch('/api/news/refresh', {method:'POST'});
            await loadNews();
            renderFullNews();
        } catch(e) { alert('刷新失败'); }
    }

    function showFullNews() { switchView('news'); loadAllNews(); }

    // ========== 工具 ==========
    function esc(s) {
        if (!s) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }
    function fmt(iso) {
        if (!iso) return '';
        return new Date(iso).toLocaleString('zh-CN', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    }
    function fmtFull(iso) {
        if (!iso) return '';
        return new Date(iso).toLocaleString('zh-CN', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    }

    // ========== 启动 ==========
    loadTasks();
