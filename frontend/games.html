<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>布布 × 一二 游戏合集</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root, [data-theme="dark"] {
            --bg: #0d1117; --card: #161b22; --card-hover: #1c2128;
            --border: #30363d; --text: #e6edf3; --text-2: #8b949e;
        }
        [data-theme="light"] {
            --bg: #f0f2f5; --card: #ffffff; --card-hover: #f7f8fa;
            --border: #d0d7de; --text: #1f2328; --text-2: #656d76;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, sans-serif;
            min-height: 100vh; margin: 0;
            transition: background 0.3s, color 0.3s;
        }
        .accent-bar { height: 2px; background: linear-gradient(90deg, #FFD93D, #FF6B6B, #4fc3f7); }

        .header {
            padding: 20px 20px 14px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .back-btn {
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            color: var(--text); padding: 7px 14px; font-size: 12px;
            text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }
        .back-btn:hover { border-color: #FFD93D; color: #FFD93D; }
        .header h1 { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }

        .chars-banner { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 10px 20px 4px; }
        .char-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
        .char-avatar.bubu { border: 3px solid #FFD93D; box-shadow: 0 0 16px rgba(255,217,61,0.4); }
        .char-avatar.yiyi { border: 3px solid #4fc3f7; box-shadow: 0 0 16px rgba(79,195,247,0.4); }
        .vs-text { font-size: 22px; font-weight: 900; color: #FF6B6B; }

        .subtitle { text-align: center; padding: 6px 20px 16px; font-size: 13px; color: var(--text-2); }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
            padding: 0 20px 40px;
        }
        .game-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
            display: block;
            color: inherit;
        }
        .game-card:hover { background: var(--card-hover); transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.25); }

        .card-thumb {
            height: 130px;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        .card-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .game-card:hover .card-thumb img { transform: scale(1.06); }
        .card-thumb-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,0.55)); }
        .card-icon { position: relative; z-index: 2; font-size: 36px; }

        .card-status {
            position: absolute; top: 8px; right: 8px; z-index: 3;
            font-size: 10px; font-weight: 700;
            padding: 3px 9px; border-radius: 10px;
        }
        .status-play { background: #FF6B6B; color: #fff; }
        .status-soon { background: rgba(255,255,255,0.15); color: #fff; }

        .card-body { padding: 12px 14px; }
        .card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .card-desc { font-size: 12px; color: var(--text-2); line-height: 1.5; }
        .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
        .card-tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--border); color: var(--text-2); }
        .tag-chase { background: rgba(255,217,61,0.15); color: #FFD93D; }

        .footer { text-align: center; padding: 20px; font-size: 12px; color: var(--text-2); border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="accent-bar"></div>

<div class="header">
    <a href="/" class="back-btn"><i class="fas fa-home"></i> 任务中心</a>
    <h1>🎮 布布 × 一二</h1>
    <div style="width:70px"></div>
</div>

<div class="chars-banner">
    <img src="/assets/bubu-cool-card.jpg" class="char-avatar bubu" alt="布布">
    <div class="vs-text">💕</div>
    <img src="/assets/bubu-pink-card.jpg" class="char-avatar yiyi" alt="一二">
</div>

<p class="subtitle">布布和一二的小游戏合集 · 更多游戏开发中 🐕 🤖</p>

<div class="games-grid">

    <!-- 敲蛋 -->
    <a href="/game" class="game-card" style="border-color:#58a6ff33">
        <div class="card-thumb">
            <img src="/assets/bubu-cool-card.jpg" alt="">
            <div class="card-thumb-overlay"></div>
            <div class="card-icon">🥚</div>
            <div class="card-status status-play">可玩</div>
        </div>
        <div class="card-body">
            <div class="card-title">敲蛋解压 🥚</div>
            <div class="card-desc">快速敲击打碎蛋壳，裂纹叠加+蛋碎特效，连击成就系统。越敲越爽！</div>
            <div class="card-tags">
                <span class="card-tag" style="background:rgba(88,166,255,0.15);color:#58a6ff">🔥 解压</span>
                <span class="card-tag">⏱️ 即时</span>
            </div>
        </div>
    </a>

    <!-- 追逐战 -->
    <a href="/game3" class="game-card" style="border-color:#FFD93D33">
        <div class="card-thumb">
            <img src="/assets/bubu-pink-card.jpg" alt="">
            <div class="card-thumb-overlay"></div>
            <div class="card-icon">🏃</div>
            <div class="card-status status-play">可玩</div>
        </div>
        <div class="card-body">
            <div class="card-title">追逐战 🏃</div>
            <div class="card-desc">布布追一二！疯狂点击让一二逃跑，跑太慢就会被抓到！</div>
            <div class="card-tags">
                <span class="card-tag tag-chase">⚡ 速度</span>
                <span class="card-tag">🎯 反应</span>
            </div>
        </div>
    </a>

    <!-- 快递接接接 -->
    <a href="/game4" class="game-card" style="border-color:#FFD93D33">
        <div class="card-thumb">
            <img src="/assets/bubu-cool-card.jpg" alt="">
            <div class="card-thumb-overlay"></div>
            <div class="card-icon">📦</div>
            <div class="card-status status-play">可玩</div>
        </div>
        <div class="card-body">
            <div class="card-title">快递接接接 📦</div>
            <div class="card-desc">布布接天上掉下来的快递！左右移动接住快递，漏了扣命！</div>
            <div class="card-tags">
                <span class="card-tag" style="background:rgba(255,217,61,0.15);color:#FFD93D">📦 收集</span>
                <span class="card-tag">⚡ 速度</span>
            </div>
        </div>
    </a>

</div>

<div class="footer">
    <i class="fas fa-heart" style="color:#FF6B6B"></i> 布布和一二的小窝 · 持续更新中
</div>

<script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
</script>
</body>
</html>
