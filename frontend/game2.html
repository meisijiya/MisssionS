<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>咬屁屁大战</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root, [data-theme="dark"] {
            --bg: #0d1117;
        }
        [data-theme="light"] {
            --bg: #f0f2f5;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            font-family: -apple-system, sans-serif;
            min-height: 100vh; overflow: hidden;
            transition: background 0.3s;
            background: #0d1117;
        }

        /* ========== 顶部 ========== */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            padding: 12px 16px 10px;
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(to bottom, rgba(13,17,23,0.95), transparent);
        }
        .back-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; color: #e6edf3; padding: 7px 13px; font-size: 12px;
            text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
        }
        .title {
            font-size: 17px; font-weight: 800; color: #FFD93D;
            text-shadow: 0 0 20px rgba(255,217,61,0.4);
        }
        .cry-counter {
            background: rgba(255,80,80,0.2); border: 1px solid rgba(255,80,80,0.4);
            border-radius: 20px; padding: 5px 14px;
            color: #FF6B6B; font-size: 13px; font-weight: 800;
            display: flex; align-items: center; gap: 5px;
        }

        /* ========== 场景 ========== */
        .scene {
            position: fixed; inset: 0; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }

        /* 角色容器 */
        .chars {
            display: flex; align-items: flex-end; gap: 0;
            height: 100vh; padding-bottom: 80px;
        }

        /* 布布 — 左边，咬人的 */
        .bubu-wrap {
            position: relative;
            width: 50vw; height: 100%;
            display: flex; flex-direction: column;
            align-items: flex-end; justify-content: flex-end;
            padding: 0 0 80px 0;
        }
        .bubu-photo {
            width: 100%; height: 55vh;
            object-fit: cover;
            object-position: center;
            border-radius: 30px 0 0 30px;
            box-shadow: -4px 0 30px rgba(0,0,0,0.4);
            transition: transform 0.08s;
        }
        .bubu-photo.bite {
            animation: bubuBite 0.18s ease-in-out;
        }
        @keyframes bubuBite {
            0%,100% { transform: translateX(0) rotate(0); }
            45%      { transform: translateX(20px) rotate(3deg); }
            75%      { transform: translateX(12px) rotate(1deg); }
        }

        /* 一二 — 右边，被咬的 */
        .yiyi-wrap {
            position: relative;
            width: 50vw; height: 100%;
            display: flex; flex-direction: column;
            align-items: flex-start; justify-content: flex-end;
            padding: 0 0 80px 0;
        }
        .yiyi-photo {
            width: 100%; height: 55vh;
            object-fit: cover;
            object-position: center;
            border-radius: 0 30px 30px 0;
            box-shadow: 4px 0 30px rgba(0,0,0,0.4);
            transition: transform 0.08s;
        }
        .yiyi-photo.hurt {
            animation: yiyiHurt 0.18s ease-out;
        }
        @keyframes yiyiHurt {
            0%,100% { transform: translateX(0); }
            40%      { transform: translateX(-15px) rotate(-3deg) scale(0.97); }
            70%      { transform: translateX(-5px) rotate(-1deg) scale(1.02); }
        }

        /* 一二的大头像（被咬后的夸张表情） */
        .yiyi-face {
            position: absolute;
            top: 60px; left: 50%; transform: translateX(-50%);
            width: 28vw; height: 28vw; max-width: 120px; max-height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255,80,80,0.6);
            box-shadow: 0 0 30px rgba(255,80,80,0.4);
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 20;
        }
        .yiyi-face.show { opacity: 1; animation: faceSqueeze 0.2s ease-out; }
        @keyframes faceSqueeze {
            0%   { transform: translateX(-50%) scale(0.5); }
            60%  { transform: translateX(-50%) scale(1.15); }
            100% { transform: translateX(-50%) scale(1); }
        }
        .yiyi-face img { width: 100%; height: 100%; object-fit: cover; }

        /* 咬痕emoji叠加 */
        .bite-marks {
            position: absolute;
            top: 50%; right: 0; transform: translateY(-50%);
            pointer-events: none; z-index: 15;
        }
        .bite-mark {
            position: absolute;
            font-size: 28px;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .bite-mark.pop { opacity: 1; animation: markPop 0.3s ease-out; }
        @keyframes markPop {
            0%   { transform: scale(0.2); }
            60%  { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* 惨叫声气泡 */
        .cry-bubble {
            position: fixed;
            top: 70px; left: 50%; transform: translateX(-50%);
            background: #fff; border-radius: 20px;
            padding: 8px 16px; font-size: 15px; font-weight: 800;
            color: #333; white-space: nowrap;
            box-shadow: 0 6px 24px rgba(0,0,0,0.3);
            opacity: 0; z-index: 100;
            transition: opacity 0.12s, transform 0.12s;
            transform: translateX(-50%) scale(0.7);
        }
        .cry-bubble::after {
            content: ''; position: absolute;
            bottom: -8px; left: 50%; transform: translateX(-50%);
            border: 8px solid transparent; border-top-color: #fff; border-bottom: 0;
        }
        .cry-bubble.show {
            opacity: 1; transform: translateX(-50%) scale(1);
        }

        /* 特效：牙印飞溅 */
        .tooth-splash {
            position: fixed; pointer-events: none; z-index: 80;
            font-size: 24px;
            animation: splashFly 0.7s ease-out forwards;
        }
        @keyframes splashFly {
            0%   { transform: translate(0,0) scale(0.5) rotate(0); opacity: 1; }
            100% { transform: translate(var(--tx),var(--ty)) scale(1) rotate(var(--rot)); opacity: 0; }
        }

        /* 特效：POW */
        .pow-big {
            position: fixed; pointer-events: none; z-index: 90;
            font-size: 40px; font-weight: 900;
            animation: powUp 0.6s ease-out forwards;
        }
        @keyframes powUp {
            0%   { transform: scale(0.2) translateY(0) rotate(-5deg); opacity: 1; }
            40%  { transform: scale(1.4) translateY(-30px) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) translateY(-80px) rotate(-3deg); opacity: 0; }
        }

        /* 屏幕闪红 */
        .hurt-splash {
            position: fixed; inset: 0; pointer-events: none; z-index: 200;
            background: radial-gradient(ellipse at 50% 50%, rgba(255,60,60,0.2), transparent 70%);
            animation: splashRed 0.2s ease-out forwards;
        }
        @keyframes splashRed {
            0%   { opacity: 1; }
            100% { opacity: 0; }
        }

        /* 连击大字 */
        .combo-text {
            position: fixed; left: 50%; top: 40%;
            transform: translate(-50%, -50%);
            font-size: 64px; font-weight: 900; z-index: 300;
            color: #FFD93D;
            text-shadow: 0 0 50px rgba(255,217,61,0.9), 0 4px 0 #CC8800;
            animation: comboBig 1.3s ease-out forwards;
        }
        @keyframes comboBig {
            0%   { transform: translate(-50%,-50%) scale(0.1) rotate(-15deg); opacity: 1; }
            25%  { transform: translate(-50%,-50%) scale(1.6) rotate(5deg); opacity: 1; }
            100% { transform: translate(-50%,-50%) scale(1) rotate(0deg) translateY(-140px); opacity: 0; }
        }

        /* 成就 */
        .achieve {
            position: fixed; top: 70px; left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg,#1a1a2e,#16213e);
            border: 1.5px solid #FFD93D; border-radius: 16px;
            padding: 12px 24px; z-index: 400;
            color: #fff; text-align: center;
            box-shadow: 0 0 40px rgba(255,217,61,0.2);
            animation: achIn .35s ease-out, achOut .4s ease-in 2.3s forwards;
        }
        @keyframes achIn  { from{transform:translateX(-50%) translateY(-20px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }
        @keyframes achOut { from{opacity:1} to{opacity:0;transform:translateX(-50%) translateY(-15px)} }

        /* ========== 底部状态栏 ========== */
        .bbar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
            background: linear-gradient(to top, rgba(13,17,23,0.95) 50%, transparent);
            padding: 14px 16px 20px;
            display: flex; justify-content: space-around;
        }
        .bstat {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 8px 14px; text-align: center; min-width: 72px;
        }
        .bstat-num { font-size: 22px; font-weight: 900; color: #58a6ff; }
        .bstat-lbl { font-size: 10px; color: rgba(230,237,243,0.4); margin-top: 1px; }

        /* 提示 */
        .hint {
            position: fixed; bottom: 90px; left: 0; right: 0; text-align: center;
            font-size: 13px; color: rgba(230,237,243,0.3);
            animation: breathe 2.5s ease-in-out infinite;
            z-index: 50;
        }
        @keyframes breathe { 0%,100%{opacity:.25} 50%{opacity:.6} }
    </style>
</head>
<body>

<!-- 顶部 -->
<div class="topbar">
    <a href="/games" class="back-btn"><i class="fas fa-th"></i> 游戏中心</a>
    <div class="title">🐕 咬屁屁大战 🐉</div>
    <div class="cry-counter">
        <i class="fas fa-volume-up"></i>
        <span id="cryEl">0</span>
    </div>
</div>

<!-- 惨叫气泡 -->
<div class="cry-bubble" id="cryBubble">呜呜呜！😭</div>

<!-- 主场景 -->
<div class="scene" id="scene">

    <div class="chars">

        <!-- 布布（左边，咬人的） -->
        <div class="bubu-wrap">
            <img src="/assets/bubu.jpg" class="bubu-photo" id="bubuPhoto" alt="布布">
        </div>

        <!-- 一二（右边，被咬的） -->
        <div class="yiyi-wrap">
            <!-- 被咬的大头像 -->
            <div class="yiyi-face" id="yiyiFace">
                <img src="/assets/yiyi.jpg" alt="一二">
            </div>
            <!-- 咬痕 -->
            <div class="bite-marks">
                <div class="bite-mark" id="m1" style="right:-5px;top:-10px">😵</div>
                <div class="bite-mark" id="m2" style="right:-15px;top:30px">🩹</div>
                <div class="bite-mark" id="m3" style="right:-8px;top:70px">💔</div>
            </div>
            <!-- 一二全身照 -->
            <img src="/assets/yiyi.jpg" class="yiyi-photo" id="yiyiPhoto" alt="一二">
        </div>

    </div>
</div>

<!-- 提示 -->
<div class="hint">
    <i class="fas fa-hand-pointer"></i> 点击屏幕让布布咬一二！
</div>

<!-- 底部 -->
<div class="bbar">
    <div class="bstat">
        <div class="bstat-num" id="comboEl">0</div>
        <div class="bstat-lbl">连击</div>
    </div>
    <div class="bstat">
        <div class="bstat-num" id="biteEl">0</div>
        <div class="bstat-lbl">咬了</div>
    </div>
    <div class="bstat">
        <div class="bstat-num" id="hurtEl" style="color:#FF6B6B">0</div>
        <div class="bstat-lbl">痛苦值</div>
    </div>
    <div class="bstat">
        <div class="bstat-num" id="maxEl">0</div>
        <div class="bstat-lbl">最高连击</div>
    </div>
</div>

<div id="achieveBox"></div>

<script>
// ========== 台词 ==========
const CRY = [
    '呜呜呜！😭','救命啊！！🆘','好痛啊啊啊！😵',
    '痛痛痛！！💔','不要咬了！！🥺','呜呜！！😫',
    '我的屁屁！！💥','救命！！😱','呜呜呜呜！😭😭',
    '咬轻点！！🥺','主人救我！！🏃','我要报警！🚔',
    '不要不要！🙅','痛死了！！💢','好痛好痛！😖',
    '别咬啦！！🙏','随便你！！😤','救命啊！！🆘🆘',
    '呜呜呜！🥺','痛！！😵‍💫','救命！！😭😭',
    '布布别咬了！！😵','好痛！！💥💥','呜呜！！😱',
];

const PAIN_FACE = ['😵','😫','😱','🤯','💔','😖','😭','😩'];

// ========== 状态 ==========
let combo = 0, maxCombo = 0;
let totalBites = 0, cryCount = 0;
let hurtLevel = 0;
let lastTap = 0, biteSpot = 0;
let timer = null;
let earned = new Set();

// DOM
const scene    = document.getElementById('scene');
const bubuPhoto = document.getElementById('bubuPhoto');
const yiyiPhoto = document.getElementById('yiyiPhoto');
const yiyiFace  = document.getElementById('yiyiFace');
const cryBubble = document.getElementById('cryBubble');
const m1 = document.getElementById('m1');
const m2 = document.getElementById('m2');
const m3 = document.getElementById('m3');
const comboEl  = document.getElementById('comboEl');
const biteEl   = document.getElementById('biteEl');
const cryEl    = document.getElementById('cryEl');
const hurtEl   = document.getElementById('hurtEl');
const maxEl    = document.getElementById('maxEl');

// ========== 攻击 ==========
scene.addEventListener('pointerdown', e => {
    e.preventDefault();
    totalBites++;

    const now = Date.now();
    const gap = now - lastTap;
    lastTap = now;

    // 连击
    if (gap < 450) {
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        if (combo >= 5 && combo % 5 === 0) {
            showCombo(combo);
            checkAchieve();
        }
    } else {
        combo = Math.max(0, combo - 5);
    }
    comboEl.textContent = combo;
    maxEl.textContent  = maxCombo;

    clearTimeout(timer);
    timer = setTimeout(() => { combo = 0; comboEl.textContent = 0; }, 1500);

    // ===== 动画 =====
    // 布布扑过去咬
    bubuPhoto.classList.remove('bite');
    void bubuPhoto.offsetWidth;
    bubuPhoto.classList.add('bite');

    // 一二被咬缩
    yiyiPhoto.classList.remove('hurt');
    void yiyiPhoto.offsetWidth;
    yiyiPhoto.classList.add('hurt');

    // 大头像
    yiyiFace.classList.remove('show');
    void yiyiFace.offsetWidth;
    yiyiFace.classList.add('show');
    setTimeout(() => yiyiFace.classList.remove('show'), 800);

    // 咬痕
    if (combo >= 2) {
        biteSpot = (biteSpot % 3) + 1;
        [m1,m2,m3].forEach((m, i) => {
            m.classList.toggle('pop', i < biteSpot);
        });
        // 惨叫
        cryCount++;
        showCry();
        // 痛苦值
        hurtLevel += combo + 1;
        updateStats();
    }

    // 特效
    if (combo >= 3) spawnTooth();
    spawnPow();
    if (combo >= 5) doFlash();
});

// ========== 惨叫 ==========
function showCry() {
    cryEl.textContent = cryCount;
    const text = CRY[Math.floor(Math.random() * CRY.length)];
    cryBubble.textContent = text;
    cryBubble.classList.remove('show');
    void cryBubble.offsetWidth;
    cryBubble.classList.add('show');
    setTimeout(() => cryBubble.classList.remove('show'), 1500);
}

// ========== 特效 ==========
function spawnTooth() {
    const chars = ['😵','💥','🩹','⚡','❗'];
    for (let i = 0; i < 4; i++) {
        const el = document.createElement('div');
        el.className = 'tooth-splash';
        el.textContent = chars[Math.floor(Math.random() * chars.length)];
        el.style.left = (50 + Math.random() * 10) + '%';
        el.style.top  = (35 + Math.random() * 20) + '%';
        const tx = (Math.random() - 0.5) * 150;
        const ty = (Math.random() - 0.5) * 150;
        el.style.setProperty('--tx', tx + 'px');
        el.style.setProperty('--ty', ty + 'px');
        el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 700);
    }
}

function spawnPow() {
    const texts = combo >= 10 ? ['💥💥','🤯⚡'] : combo >= 5 ? ['💥','❗','👊'] : ['💥'];
    const colors = ['#FF6B6B','#FFD93D','#FF8C00','#f85149'];
    const el = document.createElement('div');
    el.className = 'pow-big';
    el.textContent = texts[Math.floor(Math.random() * texts.length)];
    el.style.left = (35 + Math.random() * 30) + '%';
    el.style.top  = (30 + Math.random() * 20) + '%';
    el.style.color = colors[Math.floor(Math.random() * colors.length)];
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 600);
}

function doFlash() {
    const f = document.createElement('div');
    f.className = 'hurt-splash';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 200);
}

function showCombo(n) {
    const el = document.createElement('div');
    el.className = 'combo-text';
    el.textContent = n + ' COMBO! 🔥';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
}

// ========== 统计 ==========
function updateStats() {
    biteEl.textContent = totalBites;
    hurtEl.textContent = hurtLevel;
}

// ========== 成就 ==========
const ACHS = [
    {id:'f1',  label:'初次咬到 🐾', cond:()=>totalBites>=1},
    {id:'c5',  label:'5连击！⚡', cond:()=>maxCombo>=5},
    {id:'c10', label:'10连击！💫', cond:()=>maxCombo>=10},
    {id:'c15', label:'15连击！🔥', cond:()=>maxCombo>=15},
    {id:'c20', label:'20连击！💥', cond:()=>maxCombo>=20},
    {id:'p100',label:'痛苦值100 💔', cond:()=>hurtLevel>=100},
    {id:'p500',label:'痛苦值500 💀', cond:()=>hurtLevel>=500},
];
function checkAchieve() {
    ACHS.forEach(a => {
        if (!earned.has(a.id) && a.cond()) {
            earned.add(a.id);
            const el = document.createElement('div');
            el.className = 'achieve';
            el.innerHTML = `<div style="font-size:16px">🏆 成就解锁</div><div style="font-size:12px;margin-top:3px;color:#FFD93D">${a.label}</div>`;
            document.getElementById('achieveBox').appendChild(el);
            setTimeout(() => el.remove(), 2800);
        }
    });
}
</script>
</body>
</html>
