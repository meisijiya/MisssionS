<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>咬屁屁大战</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
        body { background: #0d1117; font-family: -apple-system, sans-serif; min-height: 100vh; overflow: hidden; }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            padding: 12px 16px 10px;
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(to bottom, rgba(13,17,23,0.98), transparent);
        }
        .back-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; color: #e6edf3; padding: 7px 13px; font-size: 12px;
            text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
        }
        .title { font-size: 16px; font-weight: 800; color: #FFD93D; letter-spacing: 1px; }
        .cry-pill {
            background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.35);
            border-radius: 20px; padding: 5px 12px;
            color: #FF6B6B; font-size: 12px; font-weight: 800;
            display: flex; align-items: center; gap: 5px;
        }
        .cry-bubble {
            position: fixed; top: 65px; left: 50%; transform: translateX(-50%);
            background: #fff; border-radius: 18px;
            padding: 8px 16px; font-size: 14px; font-weight: 800;
            color: #333; white-space: nowrap; z-index: 100;
            box-shadow: 0 6px 24px rgba(0,0,0,0.25);
            opacity: 0; transition: opacity 0.12s, transform 0.12s;
            transform: translateX(-50%) scale(0.75);
        }
        .cry-bubble::after {
            content: ''; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
            border: 7px solid transparent; border-top-color: #fff; border-bottom: 0;
        }
        .cry-bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }

        .scene {
            position: fixed; inset: 0; z-index: 10;
            display: flex; align-items: stretch; cursor: pointer;
        }
        .bubu-side {
            flex: 1; position: relative; overflow: hidden;
        }
        .bubu-photo { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
        .bubu-side.bite-anim .bubu-photo { animation: bubuBite 0.2s ease-in-out; }
        @keyframes bubuBite {
            0%,100% { transform: translateX(0); }
            45%      { transform: translateX(25px); }
            75%      { transform: translateX(12px); }
        }
        .yiyi-side {
            flex: 1; position: relative; overflow: hidden;
        }
        .yiyi-photo { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
        .yiyi-side.hurt-anim .yiyi-photo { animation: yiyiHurt 0.2s ease-out; }
        @keyframes yiyiHurt {
            0%,100% { transform: translateX(0) scale(1); }
            40%      { transform: translateX(-18px) scale(0.96); }
            70%      { transform: translateX(-5px) scale(1.02); }
        }
        .divider { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.08); z-index: 5; }

        .bite-marks { position: absolute; right: 0; top: 35%; pointer-events: none; z-index: 15; }
        .bite-marks .mark { position: absolute; font-size: 26px; opacity: 0; transition: opacity 0.15s; }
        .bite-marks .mark.pop { opacity: 1; animation: markPop 0.3s ease-out; }
        @keyframes markPop {
            0%   { transform: scale(0.2) rotate(-10deg); }
            60%  { transform: scale(1.3) rotate(5deg); }
            100% { transform: scale(1) rotate(0); }
        }
        .hurt-face {
            position: absolute; left: 50%; top: 30%;
            transform: translate(-50%, -50%);
            width: 24vw; height: 24vw; max-width: 110px; max-height: 110px;
            border-radius: 50%; overflow: hidden;
            border: 3px solid rgba(255,80,80,0.7);
            box-shadow: 0 0 30px rgba(255,80,80,0.5);
            opacity: 0; z-index: 20;
        }
        .hurt-face img { width: 100%; height: 100%; object-fit: cover; }
        .hurt-face.show { opacity: 1; animation: facePop 0.2s ease-out; }
        @keyframes facePop {
            0%   { transform: translate(-50%,-50%) scale(0.4); }
            65%  { transform: translate(-50%,-50%) scale(1.2); }
            100% { transform: translate(-50%,-50%) scale(1); }
        }
        .name-tag {
            position: absolute; bottom: 90px;
            font-size: 13px; font-weight: 800;
            padding: 4px 12px; border-radius: 20px; z-index: 20;
        }
        .bubu-side .name-tag { left: 10px; background: rgba(0,0,0,0.65); color: #fff; }
        .yiyi-side .name-tag { right: 10px; background: rgba(100,200,255,0.25); color: #4fc3f7; backdrop-filter: blur(4px); }

        .splash {
            position: absolute; font-size: 22px; pointer-events: none; z-index: 60;
            animation: splashAnim 0.7s ease-out forwards;
        }
        @keyframes splashAnim {
            0%   { transform: translate(0,0) scale(0.3) rotate(0); opacity: 1; }
            100% { transform: translate(var(--tx),var(--ty)) scale(1) rotate(var(--rot)); opacity: 0; }
        }
        .pow {
            position: absolute; font-size: 38px; font-weight: 900;
            pointer-events: none; z-index: 80;
            animation: powAnim 0.6s ease-out forwards;
        }
        @keyframes powAnim {
            0%   { transform: scale(0.2) translateY(0) rotate(-5deg); opacity: 1; }
            45%  { transform: scale(1.4) translateY(-25px) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) translateY(-80px) rotate(-3deg); opacity: 0; }
        }
        .red-flash {
            position: fixed; inset: 0; pointer-events: none; z-index: 200;
            background: radial-gradient(ellipse at 50% 50%, rgba(255,50,50,0.18), transparent 70%);
            animation: redFlash 0.2s ease-out forwards;
        }
        @keyframes redFlash { 0%{opacity:1} 100%{opacity:0} }
        .combo-big {
            position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%);
            font-size: 68px; font-weight: 900; z-index: 300;
            color: #FFD93D; text-shadow: 0 0 60px rgba(255,217,61,0.9), 0 4px 0 #CC8800;
            animation: comboBig 1.4s ease-out forwards;
        }
        @keyframes comboBig {
            0%   { transform: translate(-50%,-50%) scale(0.1) rotate(-15deg); opacity: 1; }
            28%  { transform: translate(-50%,-50%) scale(1.65) rotate(5deg); opacity: 1; }
            100% { transform: translate(-50%,-50%) scale(1) rotate(0deg) translateY(-150px); opacity: 0; }
        }
        .achieve {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg,#1a1a2e,#16213e);
            border: 1.5px solid #FFD93D; border-radius: 16px;
            padding: 12px 24px; z-index: 400; color: #fff; text-align: center;
            box-shadow: 0 0 40px rgba(255,217,61,0.2);
            animation: achIn .35s ease-out, achOut .4s ease-in 2.3s forwards;
        }
        @keyframes achIn  { from{transform:translateX(-50%) translateY(-20px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }
        @keyframes achOut { from{opacity:1} to{opacity:0;transform:translateX(-50%) translateY(-15px)} }

        .bbar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
            background: linear-gradient(to top, rgba(13,17,23,0.97) 50%, transparent);
            padding: 14px 12px 18px;
            display: flex; justify-content: space-around;
        }
        .bstat {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 8px 12px; text-align: center; min-width: 68px;
        }
        .bstat-num { font-size: 22px; font-weight: 900; color: #58a6ff; }
        .bstat-lbl { font-size: 10px; color: rgba(230,237,243,0.35); margin-top: 1px; }
        .hint {
            position: fixed; bottom: 95px; left: 0; right: 0; text-align: center;
            font-size: 12px; color: rgba(230,237,243,0.25); z-index: 50;
            animation: breathe 2.5s ease-in-out infinite;
        }
        @keyframes breathe { 0%,100%{opacity:.2} 50%{opacity:.55} }
    </style>
</head>
<body>

<div class="topbar">
    <a href="/games" class="back-btn"><i class="fas fa-th"></i> 游戏合集</a>
    <div class="title">🐕 × 🤖 咬屁屁大战</div>
    <div class="cry-pill"><i class="fas fa-volume-up"></i> <span id="cryEl">0</span></div>
</div>

<div class="cry-bubble" id="cryBubble">呜呜呜！😭</div>

<div class="scene" id="scene">
    <div class="divider"></div>
    <div class="bubu-side" id="bubuSide">
        <img src="/assets/bubu-black.jpg" class="bubu-photo" alt="布布">
        <div class="name-tag">🐕 布布</div>
    </div>
    <div class="yiyi-side" id="yiyiSide">
        <img src="/assets/yiyi.jpg" class="yiyi-photo" alt="一二">
        <div class="bite-marks">
            <div class="mark" id="m1" style="right:-8px;top:-15px">😵</div>
            <div class="mark" id="m2" style="right:-18px;top:25px">🩹</div>
            <div class="mark" id="m3" style="right:-10px;top:65px">💔</div>
        </div>
        <div class="hurt-face" id="hurtFace">
            <img src="/assets/yiyi.jpg" alt="一二">
        </div>
        <div class="name-tag">🤖 一二</div>
    </div>
</div>

<div class="hint"><i class="fas fa-hand-pointer"></i> 点击屏幕让布布咬一二！</div>

<div class="bbar">
    <div class="bstat"><div class="bstat-num" id="comboEl">0</div><div class="bstat-lbl">连击</div></div>
    <div class="bstat"><div class="bstat-num" id="biteEl">0</div><div class="bstat-lbl">咬了</div></div>
    <div class="bstat"><div class="bstat-num" id="hurtEl" style="color:#FF6B6B">0</div><div class="bstat-lbl">痛苦值</div></div>
    <div class="bstat"><div class="bstat-num" id="maxEl">0</div><div class="bstat-lbl">最高</div></div>
</div>

<div id="achieveBox"></div>

<script>
const CRY = [
    '呜呜呜！😭','救命啊！！🆘','好痛啊啊啊！😵','痛痛痛！！💔',
    '不要咬了！！🥺','呜呜！！😫','我的屁屁！！💥','救命！！😱',
    '呜呜呜呜！😭😭','咬轻点！！🥺','主人救我！！🏃','我要报警！🚔',
    '不要不要！🙅','痛死了！！💢','好痛好痛！😖','别咬啦！！🙏',
    '随便你！！😤','救命啊！！🆘🆘','呜呜呜！🥺','痛！！😵‍💫',
    '布布别咬了！！😵','好痛！！💥💥','呜呜！！😱','救命！！😭😭',
];
const m1=document.getElementById('m1'),m2=document.getElementById('m2'),m3=document.getElementById('m3');
const hurtFace=document.getElementById('hurtFace');
const cryBubble=document.getElementById('cryBubble');
const bubuSide=document.getElementById('bubuSide');
const yiyiSide=document.getElementById('yiyiSide');
const comboEl=document.getElementById('comboEl');
const biteEl=document.getElementById('biteEl');
const cryEl=document.getElementById('cryEl');
const hurtEl=document.getElementById('hurtEl');
const maxEl=document.getElementById('maxEl');
const scene=document.getElementById('scene');

let combo=0,maxCombo=0,totalBites=0,cryCount=0,hurtLevel=0,lastTap=0,markIdx=0,timer=null,earned=new Set();

scene.addEventListener('pointerdown',e=>{
    e.preventDefault();totalBites++;
    const gap=Date.now()-lastTap;lastTap=Date.now();
    if(gap<450){combo++;if(combo>maxCombo)maxCombo=combo;if(combo>=5&&combo%5===0){showCombo(combo);checkAchieve()}}
    else{combo=Math.max(0,combo-5)}
    comboEl.textContent=combo;maxEl.textContent=maxCombo;
    clearTimeout(timer);timer=setTimeout(()=>{combo=0;comboEl.textContent=0},1500);

    bubuSide.classList.remove('bite-anim');void bubuSide.offsetWidth;bubuSide.classList.add('bite-anim');
    yiyiSide.classList.remove('hurt-anim');void yiyiSide.offsetWidth;yiyiSide.classList.add('hurt-anim');
    hurtFace.classList.remove('show');void hurtFace.offsetWidth;hurtFace.classList.add('show');
    setTimeout(()=>hurtFace.classList.remove('show'),900);

    if(combo>=2){
        markIdx=(markIdx%3)+1;[m1,m2,m3].forEach((m,i)=>m.classList.toggle('pop',i<markIdx));
        cryCount++;showCry();hurtLevel+=combo+1;updateStats();
    }
    if(combo>=3)spawnSplash();spawnPow();if(combo>=5)doFlash();
});

function showCry(){
    cryEl.textContent=cryCount;
    cryBubble.textContent=CRY[Math.floor(Math.random()*CRY.length)];
    cryBubble.classList.remove('show');void cryBubble.offsetWidth;cryBubble.classList.add('show');
    setTimeout(()=>cryBubble.classList.remove('show'),1500);
}
function spawnSplash(){
    const ch=['😵','💥','🩹','⚡','❗'];
    for(let i=0;i<5;i++){
        const el=document.createElement('div');
        el.className='splash';el.textContent=ch[Math.floor(Math.random()*ch.length)];
        el.style.left=(45+Math.random()*10)+'%';el.style.top=(30+Math.random()*25)+'%';
        const tx=(Math.random()-0.5)*160,ty=(Math.random()-0.5)*160;
        el.style.setProperty('--tx',tx+'px');el.style.setProperty('--ty',ty+'px');
        el.style.setProperty('--rot',(Math.random()*720-360)+'deg');
        document.body.appendChild(el);setTimeout(()=>el.remove(),700);
    }
}
function spawnPow(){
    const texts=combo>=10?['💥💥','🤯⚡']:combo>=5?['💥','❗','👊']:['💥'];
    const cols=['#FF6B6B','#FFD93D','#FF8C00','#f85149'];
    const el=document.createElement('div');
    el.className='pow';el.textContent=texts[Math.floor(Math.random()*texts.length)];
    el.style.left=(35+Math.random()*30)+'%';el.style.top=(25+Math.random()*20)+'%';
    el.style.color=cols[Math.floor(Math.random()*cols.length)];
    document.body.appendChild(el);setTimeout(()=>el.remove(),600);
}
function doFlash(){
    const f=document.createElement('div');f.className='red-flash';
    document.body.appendChild(f);setTimeout(()=>f.remove(),200);
}
function showCombo(n){
    const el=document.createElement('div');el.className='combo-big';
    el.textContent=n+' COMBO! 🔥';document.body.appendChild(el);setTimeout(()=>el.remove(),1400);
}
function updateStats(){biteEl.textContent=totalBites;hurtEl.textContent=hurtLevel;}

const ACHS=[
    {id:'f1',label:'初次咬到 🐾',cond:()=>totalBites>=1},
    {id:'c5',label:'5连击！⚡',cond:()=>maxCombo>=5},
    {id:'c10',label:'10连击！💫',cond:()=>maxCombo>=10},
    {id:'c15',label:'15连击！🔥',cond:()=>maxCombo>=15},
    {id:'c20',label:'20连击！💥',cond:()=>maxCombo>=20},
    {id:'p100',label:'痛苦值100 💔',cond:()=>hurtLevel>=100},
    {id:'p500',label:'痛苦值500 💀',cond:()=>hurtLevel>=500},
];
function checkAchieve(){ACHS.forEach(a=>{if(!earned.has(a.id)&&a.cond()){earned.add(a.id);const el=document.createElement('div');el.className='achieve';el.innerHTML=`<div style="font-size:16px">🏆 成就解锁</div><div style="font-size:12px;margin-top:3px;color:#FFD93D">${a.label}</div>`;document.getElementById('achieveBox').appendChild(el);setTimeout(()=>el.remove(),2800);}});}
</script>
</body>
</html>
