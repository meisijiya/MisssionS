<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>敲蛋解压</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root, [data-theme="dark"] {
            --bg: #0d1117; --card: #161b22; --border: #30363d;
            --text: #e6edf3; --text-2: #8b949e; --accent: #58a6ff;
        }
        [data-theme="light"] {
            --bg: #f0f2f5; --card: #ffffff; --border: #d0d7de;
            --text: #1f2328; --text-2: #656d76; --accent: #58a6ff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh; margin: 0; overflow: hidden;
            transition: background 0.3s;
        }
        .bg-pattern {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(circle at 20% 80%, rgba(88,166,255,0.07) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(188,140,255,0.07) 0%, transparent 50%);
        }
        .topbar {
            position: relative; z-index: 10; padding: 16px 20px 12px;
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(to bottom, var(--bg), transparent);
        }
        .back-btn {
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            color: var(--text); padding: 8px 14px; font-size: 13px; cursor: pointer;
            text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }
        .stat-pill {
            background: var(--card); border: 1px solid var(--border); border-radius: 20px;
            padding: 6px 16px; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
        }
        .combo-num { font-size: 22px; font-weight: 800; color: var(--accent); }

        .tap-area {
            position: relative; z-index: 5;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: calc(100vh - 140px);
        }

        /* ========== 蛋 ========== */
        .egg-stage {
            position: relative;
            width: 200px; height: 260px;
            display: flex; align-items: center; justify-content: center;
        }
        .egg-svg {
            width: 150px; height: 200px;
            position: relative; z-index: 2;
            transition: transform 0.06s;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.35));
        }
        .egg-svg.hit {
            animation: eggShake 0.07s ease-in-out;
        }
        @keyframes eggShake {
            0%,100% { transform: translateX(0) rotate(0); }
            25%      { transform: translateX(-10px) rotate(-5deg); }
            75%      { transform: translateX(10px) rotate(5deg); }
        }

        /* 裂纹SVG */
        .crack-svg {
            position: absolute; z-index: 3; pointer-events: none;
            width: 150px; height: 200px; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .crack-line { fill: none; stroke: #7a6550; stroke-width: 1.5; opacity: 0; }
        .crack-line.show { opacity: 1; }

        /* 蛋 HP 槽 */
        .hp-track {
            width: 140px; height: 7px;
            background: var(--border); border-radius: 4px; overflow: hidden;
            margin-top: 14px;
        }
        .hp-fill {
            height: 100%; border-radius: 4px;
            background: linear-gradient(90deg, #f85149, #d29922, #58a6ff);
            background-size: 300% 100%;
            transition: width 0.12s ease-out;
        }

        /* 提示文字 */
        .hint {
            position: absolute; bottom: 24px;
            font-size: 13px; color: var(--text-2);
            animation: breathe 2.5s ease-in-out infinite;
        }
        @keyframes breathe { 0%,100%{opacity:.4} 50%{opacity:1} }

        /* ========== 蛋碎粒子 ========== */
        .fragment {
            position: absolute;
            pointer-events: none;
            z-index: 50;
            /* 三角形碎片 */
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .fragment.yolk {
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #FFD700, #FF8C00);
        }

        @keyframes fragFly {
            0%   { transform: translate(var(--ox), var(--oy)) rotate(0deg) scale(1); opacity: 1; }
            60%  { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(var(--sc)); opacity: 0; }
        }
        @keyframes yolkFly {
            0%   { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.4); opacity: 0; }
        }

        /* ========== 屏幕特效 ========== */
        .flash { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
        @keyframes screenFlash {
            0%   { background: rgba(255,255,255,0.18); }
            100% { background: rgba(255,255,255,0); }
        }
        .combo-pop {
            position: fixed; pointer-events: none; z-index: 300;
            font-size: 52px; font-weight: 900;
            color: #FFD700; text-shadow: 0 0 40px rgba(255,215,0,.9), 0 3px 0 #FF8C00;
            animation: comboAnim 1.2s ease-out forwards;
        }
        @keyframes comboAnim {
            0%   { transform: translateX(-50%) scale(.2) translateY(0); opacity: 1; }
            30%  { transform: translateX(-50%) scale(1.4) translateY(-20px); }
            100% { transform: translateX(-50%) scale(1) translateY(-100px); opacity: 0; }
        }
        .hit-pop {
            position: absolute; pointer-events: none; z-index: 60;
            font-size: 26px; font-weight: 800;
            color: var(--accent); text-shadow: 0 0 18px rgba(88,166,255,.6);
            animation: hitAnim .55s ease-out forwards;
        }
        @keyframes hitAnim {
            0%   { transform: translateY(0) scale(.6); opacity: 1; }
            100% { transform: translateY(-70px) scale(1.1); opacity: 0; }
        }

        /* 成就 */
        .achieve {
            position: fixed; top: 80px; left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg,#1a1a2e,#16213e);
            border: 1.5px solid #FFD700; border-radius: 16px;
            padding: 14px 28px; z-index: 400;
            text-align: center; color: #fff;
            box-shadow: 0 0 50px rgba(255,215,0,.25);
            animation: achIn .4s ease-out, achOut .5s ease-in 2.2s forwards;
        }
        @keyframes achIn  { from{transform:translateX(-50%) translateY(-30px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }
        @keyframes achOut { from{opacity:1} to{opacity:0;transform:translateX(-50%) translateY(-20px)} }

        /* 底部统计 */
        .bbar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
            background: linear-gradient(to top, var(--bg) 60%, transparent);
            padding: 20px;
            display: flex; justify-content: center; gap: 16px;
        }
        .bstat {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 10px 18px; text-align: center;
        }
        .bstat-val { font-size: 22px; font-weight: 800; color: var(--accent); }
        .bstat-lbl { font-size: 11px; color: var(--text-2); margin-top: 2px; }
    </style>
</head>
<body>
<div class="bg-pattern"></div>

<!-- 顶部 -->
<div class="topbar">
    <a href="/games" class="back-btn">
        <i class="fas fa-th"></i> 游戏中心
    </a>
    <div class="stat-pill">
        <i class="fas fa-bolt" style="color:#FFD700"></i>
        <span class="combo-num" id="comboEl">0</span>
        <span style="color:var(--text-2);font-size:12px">连击</span>
    </div>
    <div class="stat-pill">
        <i class="fas fa-fire" style="color:#f85149"></i>
        <span class="combo-num" id="maxComboEl">0</span>
        <span style="color:var(--text-2);font-size:12px">最高</span>
    </div>
</div>

<!-- 敲击区 -->
<div class="tap-area" id="tapArea">

    <div class="egg-stage" id="eggStage">
        <!-- 蛋本体 -->
        <svg class="egg-svg" id="eggSvg" viewBox="0 0 100 140">
            <defs>
                <radialGradient id="eggG" cx="35%" cy="28%" r="68%">
                    <stop offset="0%"   stop-color="#fffef8"/>
                    <stop offset="55%"  stop-color="#f4eed8"/>
                    <stop offset="100%" stop-color="#e0d4b8"/>
                </radialGradient>
            </defs>
            <ellipse cx="50" cy="82" rx="40" ry="52" fill="url(#eggG)" stroke="#cfc0a0" stroke-width="1.2"/>
            <ellipse cx="34" cy="64" rx="7" ry="11" fill="rgba(255,255,255,.65)"/>
        </svg>

        <!-- 裂纹 -->
        <svg class="crack-svg" viewBox="0 0 100 140" id="crackSvg">
            <path id="c1" class="crack-line" d="M50 42 L44 58 L56 66 L42 84"/>
            <path id="c2" class="crack-line" d="M50 50 L62 63 L50 76 L63 96"/>
            <path id="c3" class="crack-line" d="M47 55 L35 70 L50 86"/>
            <path id="c4" class="crack-line" d="M53 44 L66 58 L55 72 L68 92"/>
            <path id="c5" class="crack-line" d="M44 62 L32 78 L47 100"/>
            <path id="c6" class="crack-line" d="M56 60 L70 74 L58 88 L72 108"/>
        </svg>
    </div>

    <div class="hp-track">
        <div class="hp-fill" id="hpFill" style="width:100%"></div>
    </div>

    <div class="hint">
        <i class="fas fa-hand-pointer mr-1"></i>快速敲击打碎它！
    </div>
</div>

<!-- 底部统计 -->
<div class="bbar">
    <div class="bstat"><div class="bstat-val" id="totalEggs">0</div><div class="bstat-lbl">已碎</div></div>
    <div class="bstat"><div class="bstat-val" id="totalTaps">0</div><div class="bstat-lbl">敲击</div></div>
    <div class="bstat"><div class="bstat-val" style="color:#FFD700" id="efficiency">0%</div><div class="bstat-lbl">效率</div></div>
</div>

<div id="achieveBox"></div>

<script>
    // ========== 音效 ==========
    let _ac = null;
    function getAudio() {
        if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
        return _ac;
    }
    function playTap() {
        const ctx = getAudio();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.setValueAtTime(600, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.07);
        g.gain.setValueAtTime(0.25, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
        o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.07);
    }
    function playCrack() {
        const ctx = getAudio();
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
        const src = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 600;
        src.buffer = buf; src.connect(f); f.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.6, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        src.start(ctx.currentTime);
    }
    function playCombo() {
        const ctx = getAudio();
        [523, 659, 784].forEach((f, i) => {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.value = f;
            const t = ctx.currentTime + i * 0.07;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.2, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
            o.start(t); o.stop(t + 0.2);
        });
    }

    // ========== 状态 ==========
    const MAX_HP = 12;
    let hp = MAX_HP;
    let combo = 0, maxCombo = 0;
    let totalEggs = 0, totalTaps = 0;
    let comboTimer = null;
    let lastTap = 0;
    let crackCount = 0;
    let earned = new Set();

    const eggSvg   = document.getElementById('eggSvg');
    const eggStage = document.getElementById('eggStage');
    const hpFill   = document.getElementById('hpFill');
    const tapArea  = document.getElementById('tapArea');

    // ========== 敲击 ==========
    tapArea.addEventListener('pointerdown', e => {
        e.preventDefault();
        totalTaps++;
        playTap();

        const now = Date.now();
        const gap = now - lastTap;
        lastTap = now;

        // 连击
        if (gap < 320) {
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            if (combo >= 5 && combo % 5 === 0) { playCombo(); showComboPop(combo); }
            checkAchieve();
        } else {
            combo = Math.max(0, combo - 2);
        }
        document.getElementById('comboEl').textContent = combo;
        document.getElementById('maxComboEl').textContent = maxCombo;

        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => { combo = 0; document.getElementById('comboEl').textContent = 0; }, 900);

        // 敲击动画
        eggSvg.classList.remove('hit');
        void eggSvg.offsetWidth;
        eggSvg.classList.add('hit');

        // 裂纹
        crackCount++;
        const crackEl = document.getElementById('c' + Math.min(crackCount, 6));
        if (crackEl) crackEl.classList.add('show');

        // 屏幕闪光（高连击）
        if (combo >= 4) doFlash();

        // 飘字
        spawnHit(combo >= 5 ? '💥' : '+1');

        // HP
        hp--;
        updateHP();
        if (hp <= 0) breakEgg();

        updateStats();
    });

    // ========== 破碎 ==========
    function breakEgg() {
        totalEggs++;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        playCrack();

        // 隐藏蛋
        eggSvg.style.transition = 'transform 0.5s, opacity 0.5s';
        eggSvg.style.transform = 'scale(1.3)';
        eggSvg.style.opacity = '0';

        // 蛋碎粒子
        spawnShards();
        spawnYolk();
        spawnHit('💥 x' + (combo > 5 ? combo : 1));

        // 新蛋
        setTimeout(spawnNewEgg, 700);
        updateStats();
    }

    function spawnNewEgg() {
        eggSvg.style.transition = '';
        eggSvg.style.transform = '';
        eggSvg.style.opacity = '';
        hp = MAX_HP; crackCount = 0;
        for (let i = 1; i <= 6; i++) {
            const el = document.getElementById('c' + i);
            if (el) el.classList.remove('show');
        }
        updateHP();
    }

    // ========== 碎片粒子 ==========
    function spawnShards() {
        const colors = ['#f4eed8','#e8ddc0','#d8cda8','#fffef8','#cfc0a0','#e0d4b8'];
        for (let i = 0; i < 18; i++) {
            const s = document.createElement('div');
            s.className = 'fragment';
            const sz = 10 + Math.random() * 20;
            const color = colors[Math.floor(Math.random() * colors.length)];
            const ox = (Math.random() - 0.5) * 30;
            const oy = (Math.random() - 0.5) * 30;
            const tx = ox + (Math.random() - 0.5) * 280;
            const ty = oy + 60 + Math.random() * 180;
            const rot = Math.random() * 1080 - 540;
            const sc = 0.2 + Math.random() * 0.7;
            s.style.cssText = `
                left: calc(50% + ${ox}px);
                top: calc(50% + ${oy}px);
                width: ${sz}px; height: ${sz}px;
                background: ${color};
                --ox: ${ox}px; --oy: ${oy}px;
                --tx: ${tx}px; --ty: ${ty}px;
                --rot: ${rot}deg; --sc: ${sc};
                animation: fragFly ${0.5 + Math.random()*0.5}s ease-out forwards;
            `;
            eggStage.appendChild(s);
            setTimeout(() => s.remove(), 1100);
        }
    }

    function spawnYolk() {
        for (let i = 0; i < 7; i++) {
            const y = document.createElement('div');
            y.className = 'fragment yolk';
            const sz = 8 + Math.random() * 10;
            const ox = (Math.random() - 0.5) * 20;
            const oy = (Math.random() - 0.5) * 20;
            const angle = (i / 7) * Math.PI * 2;
            const dist = 70 + Math.random() * 90;
            const tx = Math.cos(angle) * dist;
            const ty = Math.sin(angle) * dist + 40;
            y.style.cssText = `
                left: calc(50% + ${ox}px); top: calc(55% + ${oy}px);
                width: ${sz}px; height: ${sz}px;
                --tx: ${tx}px; --ty: ${ty}px;
                animation: yolkFly ${0.5 + Math.random()*0.4}s ease-out forwards;
            `;
            eggStage.appendChild(y);
            setTimeout(() => y.remove(), 900);
        }
    }

    // ========== 特效 ==========
    function doFlash() {
        const f = document.createElement('div');
        f.className = 'flash';
        f.style.animation = 'screenFlash 0.18s ease-out forwards';
        document.body.appendChild(f);
        setTimeout(() => f.remove(), 200);
    }

    function showComboPop(n) {
        const el = document.createElement('div');
        el.className = 'combo-pop';
        el.textContent = n + ' COMBO! 🔥';
        el.style.left = '50%';
        el.style.top = '38%';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1200);
    }

    function spawnHit(text) {
        const el = document.createElement('div');
        el.className = 'hit-pop';
        el.textContent = text;
        el.style.left = (30 + Math.random() * 40) + '%';
        el.style.top  = (15 + Math.random() * 25) + '%';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 550);
    }

    // ========== HP条 ==========
    function updateHP() {
        const pct = hp / MAX_HP * 100;
        hpFill.style.width = pct + '%';
        hpFill.style.backgroundPosition = (100 - pct) + '% 0';
        if (pct < 25) {
            hpFill.style.background = 'linear-gradient(90deg,#f85149,#d29922)';
        } else if (pct < 55) {
            hpFill.style.background = 'linear-gradient(90deg,#d29922,#58a6ff)';
        } else {
            hpFill.style.background = 'linear-gradient(90deg,#58a6ff,#bc8cff)';
        }
    }

    // ========== 统计 ==========
    function updateStats() {
        document.getElementById('totalEggs').textContent = totalEggs;
        document.getElementById('totalTaps').textContent = totalTaps;
        const eff = totalTaps > 0 ? Math.round(totalEggs / totalTaps * 100) : 0;
        document.getElementById('efficiency').textContent = eff + '%';
    }

    // ========== 成就 ==========
    const ACHS = [
        { id:'f1', label:'初次碎蛋 🐣', cond: () => totalEggs >= 1 },
        { id:'c10', label:'10连击！ ⚡',  cond: () => maxCombo >= 10 },
        { id:'c20', label:'20连击！ 💫',  cond: () => maxCombo >= 20 },
        { id:'c30', label:'30连击传说！ 🌟', cond: () => maxCombo >= 30 },
        { id:'e10', label:'碎蛋10颗 🥚',   cond: () => totalEggs >= 10 },
        { id:'e50', label:'碎蛋50颗 💥',   cond: () => totalEggs >= 50 },
    ];
    function checkAchieve() {
        ACHS.forEach(a => {
            if (!earned.has(a.id) && a.cond()) {
                earned.add(a.id);
                showAchieve(a.label);
            }
        });
    }
    function showAchieve(label) {
        const box = document.getElementById('achieveBox');
        const el = document.createElement('div');
        el.className = 'achieve';
        el.innerHTML = `<div style="font-size:18px">🏆 成就解锁</div><div style="font-size:13px;margin-top:4px;color:#FFD700">${label}</div>`;
        box.appendChild(el);
        setTimeout(() => el.remove(), 2700);
    }

    updateHP();
</script>
</body>
</html>
